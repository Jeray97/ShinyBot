<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      width: 1920px; height: 1080px;
      overflow: hidden;
      font-family: 'Press Start 2P', 'Courier New', monospace;
    }
    :root {
      --fire:#FF6B35;--water:#4FC3F7;--grass:#66BB6A;--electric:#FFD600;
      --psychic:#F06292;--ice:#80DEEA;--dragon:#7E57C2;--dark:#5D4037;
      --fairy:#F48FB1;--normal:#9E9E9E;--fighting:#EF5350;--flying:#90CAF9;
      --poison:#AB47BC;--ground:#FFCA28;--rock:#BCAAA4;--bug:#AED581;
      --ghost:#7E57C2;--steel:#78909C;
    }

    /* ── ANIMACIONES GLOBALES ── */
    @keyframes slideIn       { from{transform:translateX(-120%);opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes slideOut      { from{transform:translateX(0);opacity:1}     to{transform:translateX(-120%);opacity:0} }
    @keyframes blink         { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes float         { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes dmgFloat      { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-70px) scale(1.5)} }

    /* ── BASE PANELES (pokedex, anime, media) ── */
    .overlay-panel {
      position: absolute; bottom: 40px; left: 40px;
      border-radius: 20px; padding: 20px; display: none;
      background: rgba(10,10,10,0.92);
    }

    /* ── POKÉDEX ── */
    #pokedex-panel { width:480px; border:3px solid #e53935; box-shadow:0 0 30px rgba(229,57,53,0.5),inset 0 0 20px rgba(0,0,0,0.5); }
    .pokedex-header { display:flex;align-items:center;gap:10px;margin-bottom:14px;border-bottom:2px solid #e53935;padding-bottom:10px; }
    .pokedex-light  { width:18px;height:18px;border-radius:50%;background:#4fc3f7;box-shadow:0 0 10px #4fc3f7;animation:blink 1s infinite; }
    .pokedex-title  { color:#e53935;font-size:11px;letter-spacing:2px;text-transform:uppercase; }
    .pokedex-number { color:#666;font-size:10px;margin-left:auto; }
    .pokemon-main   { display:flex;align-items:center;gap:16px;margin-bottom:14px; }
    .pokemon-sprite-wrapper { width:120px;height:120px;background:rgba(255,255,255,0.05);border-radius:12px;border:2px solid #333;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden; }
    .pokemon-sprite-wrapper::before { content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 70%); }
    #pokemon-sprite { width:100px;height:100px;image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(255,255,255,0.3));animation:float 3s ease-in-out infinite; }
    .pokemon-info   { flex:1; }
    .pokemon-name   { color:#fff;font-size:18px;text-shadow:0 0 10px rgba(255,255,255,0.3);margin-bottom:8px; }
    .pokemon-types  { display:flex;gap:6px;margin-bottom:8px; }
    .type-badge     { padding:3px 10px;border-radius:20px;font-size:8px;font-weight:bold;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5); }
    .pokemon-triggered { color:#888;font-size:8px; }
    .stats-grid     { display:grid;grid-template-columns:1fr 1fr;gap:6px; }
    .stat-row       { display:flex;flex-direction:column;gap:2px; }
    .stat-label     { color:#888;font-size:7px;text-transform:uppercase;letter-spacing:1px; }
    .stat-bar-wrapper { display:flex;align-items:center;gap:6px; }
    .stat-bar       { flex:1;height:6px;background:#222;border-radius:3px;overflow:hidden; }
    .stat-bar-fill  { height:100%;border-radius:3px;transition:width 0.8s ease;width:0%; }
    .stat-value     { color:#fff;font-size:8px;min-width:24px;text-align:right; }

    /* ── ANIME ── */
    #anime-panel { width:420px; }
    .anime-header { display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px; }
    .anime-rarity-dot { width:14px;height:14px;border-radius:50%;flex-shrink:0; }
    .anime-name   { color:#fff;font-size:13px;letter-spacing:1px; }
    .anime-series { color:#aaa;font-size:8px;margin-top:4px; }
    .anime-gif-wrapper { width:100%;border-radius:12px;overflow:hidden;margin-bottom:10px; }
    #anime-gif    { width:100%;max-height:260px;object-fit:contain;border-radius:10px; }
    .anime-footer { display:flex;justify-content:space-between;align-items:center; }
    .anime-rarity-badge { font-size:7px;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:1px;color:#fff; }
    .anime-triggered { color:#888;font-size:7px; }

    /* ── MEDIA ── */
    #media-panel { width:380px; }
    .media-header { display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px; }
    .media-title  { font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#fff; }
    .media-triggered { font-size:8px;color:#aaa;margin-top:4px; }
    .media-img-wrapper { width:100%;border-radius:12px;overflow:hidden; }
    #media-gif    { width:100%;max-height:300px;object-fit:contain;border-radius:10px; }

    /* ════════════════════════════════════════════
       BATTLE SCENE — estilo combate Pokemon clasico
       ════════════════════════════════════════════ */

    #battle-scene {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 490px;
      display: none;
      overflow: hidden;
    }

    /* Fondo — cielo + hierba */
    #bs-sky {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 120px;
      background: linear-gradient(to bottom,
        #4A8FD4 0%, #6BAEE6 38%, #9ECFF0 55%,
        #A8DDA0 55%, #78C068 65%, #52924A 100%);
    }
    #bs-ground-opp {
      position: absolute;
      right: 80px; bottom: 285px;
      width: 200px; height: 36px;
      background: rgba(0,0,0,0.22);
      border-radius: 50%;
      filter: blur(8px);
    }
    #bs-ground-pl {
      position: absolute;
      left: 80px; bottom: 240px;
      width: 240px; height: 40px;
      background: rgba(0,0,0,0.22);
      border-radius: 50%;
      filter: blur(8px);
    }

    /* Sprites */
    #opp-sprite-zone {
      position: absolute;
      right: 160px; top: 20px;
      width: 190px; height: 190px;
      display: flex; align-items: flex-end; justify-content: center;
    }
    #opp-sprite {
      max-width: 170px; max-height: 170px;
      image-rendering: pixelated;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
    }

    #pl-sprite-zone {
      position: absolute;
      left: 120px; top: 140px;
      width: 230px; height: 230px;
      display: flex; align-items: flex-end; justify-content: center;
    }
    #pl-sprite {
      max-width: 210px; max-height: 210px;
      image-rendering: pixelated;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
    }

    /* HUD boxes */
    #opp-hud {
      position: absolute;
      left: 60px; top: 28px;
      width: 390px;
    }
    #pl-hud {
      position: absolute;
      right: 60px; bottom: 132px;
      width: 390px;
    }

    .b-hud-box {
      background: rgba(8,8,14,0.90);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px 18px 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .b-hud-box.active-turn {
      border-color: #FFD600;
      box-shadow: 0 0 18px rgba(255,214,0,0.35), 0 4px 24px rgba(0,0,0,0.6);
    }

    .b-name-row {
      display: flex; align-items: baseline;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .b-poke-name {
      color: #fff; font-size: 14px; letter-spacing: 1px;
    }
    .b-level {
      color: #aaa; font-size: 8px;
    }
    .b-user {
      color: #5BC8FF; font-size: 7px; margin-bottom: 10px;
    }
    .b-hp-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
    }
    .b-hp-lbl {
      color: #FFD600; font-size: 8px; letter-spacing: 2px; flex-shrink: 0;
    }
    .b-hp-track {
      flex: 1; height: 11px;
      background: #0a180a;
      border-radius: 6px;
      border: 1px solid #1a361a;
      overflow: hidden;
    }
    .b-hp-fill {
      height: 100%; border-radius: 6px;
      transition: width 0.85s cubic-bezier(0.4,0,0.2,1),
                  background-color 0.5s ease;
      background: #18C818;
    }
    .b-hp-nums {
      color: #bbb; font-size: 8px; text-align: right; margin-top: 2px;
    }
    .b-turn-arrow {
      color: #FFD600; font-size: 9px; display: none; margin-top: 6px;
    }

    /* Cuadro de mensajes — parte inferior */
    #bs-msgbox {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: rgba(6,6,10,0.96);
      border-top: 3px solid rgba(255,255,255,0.08);
      padding: 18px 60px;
      display: flex; flex-direction: column; justify-content: center; gap: 8px;
    }
    #bs-msg {
      color: #fff; font-size: 11px; line-height: 1.6;
      letter-spacing: 0.5px; margin: 0;
    }
    #bs-turn-ind {
      color: #FFD600; font-size: 8px; margin: 0;
    }

    /* Numero de dano flotante */
    .bs-dmg {
      position: absolute;
      font-size: 26px;
      color: #FF3333;
      text-shadow: 0 0 12px rgba(255,50,50,0.9), 2px 2px 0 #000, -1px -1px 0 #000;
      pointer-events: none;
      z-index: 35;
      animation: dmgFloat 1.4s ease forwards;
    }

    /* GIFs de ataque / inicio */
    #bs-start-gif, #bs-attack-gif {
      position: absolute;
      top: 44%; left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      object-fit: contain;
      display: none; z-index: 28;
      filter: drop-shadow(0 0 28px rgba(255,210,0,0.9));
    }

    /* Pantalla VS (aparece al inicio del combate) */
    #bs-vs-screen {
      position: absolute; inset: 0; z-index: 50;
      background: linear-gradient(135deg, #000814 0%, #001E3C 100%);
      display: none;
      align-items: center; justify-content: center; gap: 0;
    }
    .vs-side {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
    }
    .vs-poke { color: #FFD600; font-size: 15px; letter-spacing: 1px; }
    .vs-user { color: #aaa; font-size: 9px; }
    #vs-divider {
      width: 80px; text-align: center;
      color: #e53935; font-size: 32px;
      text-shadow: 0 0 20px rgba(229,57,53,0.8);
    }
    #bs-vs-screen .vs-side img {
      width: 120px; height: 120px; image-rendering: pixelated;
      filter: drop-shadow(0 0 16px rgba(255,255,255,0.3));
    }

    /* Pantalla de victoria */
    #bs-victory {
      position: absolute; inset: 0; z-index: 45;
      background: linear-gradient(135deg,
        rgba(0,0,0,0.82) 0%, rgba(10,5,0,0.88) 100%);
      display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #bs-victory-title {
      color: #FFD600; font-size: 36px; letter-spacing: 4px;
      text-shadow: 0 0 24px rgba(255,214,0,0.8), 3px 3px 0 #000;
      animation: victoryPulse 1s ease infinite;
    }
    #bs-victory-sub  { color: #fff; font-size: 14px; text-shadow: 2px 2px 0 #000; }
    #bs-victory-pts  { color: #FFD600; font-size: 11px; }

    @keyframes victoryPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }

    /* Animaciones de escena y sprites */
    @keyframes sceneUp    { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes sceneDown  { from{transform:translateY(0);opacity:1}    to{transform:translateY(110%);opacity:0} }
    @keyframes spriteFromLeft  { from{transform:translateX(-160px);opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes spriteFromRight { from{transform:translateX(160px);opacity:0}  to{transform:translateX(0);opacity:1} }
    @keyframes vsIn       { from{opacity:0} to{opacity:1} }
    @keyframes vsOut      { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

    /* Animaciones de combate */
    @keyframes lunge      { 0%{transform:translateX(0)} 35%{transform:translateX(36px)}  100%{transform:translateX(0)} }
    @keyframes lungeBack  { 0%{transform:translateX(0)} 35%{transform:translateX(-36px)} 100%{transform:translateX(0)} }
    @keyframes hitShake   { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
    @keyframes hitFlash   { 0%,100%{filter:drop-shadow(0 10px 16px rgba(0,0,0,0.45))} 25%,75%{filter:brightness(12) drop-shadow(0 0 20px #fff)} 50%{filter:brightness(8) drop-shadow(0 0 10px #fff)} }
    @keyframes faintDown  { 0%{transform:translateY(0) scaleY(1);opacity:1} 100%{transform:translateY(130px) scaleY(0.2);opacity:0} }
    @keyframes victoryJump{ 0%,100%{transform:translateY(0)} 25%{transform:translateY(-22px)} 75%{transform:translateY(-10px)} }
    @keyframes gifFlash   { 0%,100%{opacity:0} 8%,92%{opacity:1} }
    @keyframes msgAppear  { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

    /* ── VIDEO (!paquito) ── */
    #video-panel {
      position: absolute;
      bottom: 40px; left: 40px;
      width: 480px;
      background: rgba(8,8,8,0.95);
      border: 3px solid #FF6B35;
      border-radius: 20px;
      padding: 14px;
      display: none;
      box-shadow: 0 0 40px rgba(255,107,53,0.6);
      z-index: 40;
    }
    .video-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px; padding-bottom: 10px;
      border-bottom: 2px solid #FF6B35;
    }
    .video-title     { color:#FF6B35; font-size:10px; letter-spacing:2px; text-transform:uppercase; flex:1; }
    .video-triggered { color:#aaa; font-size:7px; }
    #paquito-video   { width:100%; border-radius:12px; max-height:320px; object-fit:cover; display:block; }

    @keyframes videoIn  { from{transform:scale(0.85) translateY(30px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
    @keyframes videoOut { from{opacity:1;transform:scale(1)} to{opacity:0;transform:scale(0.85)} }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<!-- ── POKÉDEX ── -->
<div id="pokedex-panel" class="overlay-panel">
  <div class="pokedex-header">
    <div class="pokedex-light"></div>
    <span class="pokedex-title">Pokédex</span>
    <span class="pokedex-number" id="pokemon-number">#000</span>
  </div>
  <div class="pokemon-main">
    <div class="pokemon-sprite-wrapper"><img id="pokemon-sprite" src="" alt="pokemon"></div>
    <div class="pokemon-info">
      <div class="pokemon-name" id="pokemon-name">???</div>
      <div class="pokemon-types" id="pokemon-types"></div>
      <div class="pokemon-triggered" id="pokemon-triggered"></div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-row"><span class="stat-label">HP</span><div class="stat-bar-wrapper"><div class="stat-bar"><div class="stat-bar-fill" id="bar-hp" style="background:#66BB6A"></div></div><span class="stat-value" id="val-hp">0</span></div></div>
    <div class="stat-row"><span class="stat-label">Ataque</span><div class="stat-bar-wrapper"><div class="stat-bar"><div class="stat-bar-fill" id="bar-atk" style="background:#EF5350"></div></div><span class="stat-value" id="val-atk">0</span></div></div>
    <div class="stat-row"><span class="stat-label">Defensa</span><div class="stat-bar-wrapper"><div class="stat-bar"><div class="stat-bar-fill" id="bar-def" style="background:#4FC3F7"></div></div><span class="stat-value" id="val-def">0</span></div></div>
    <div class="stat-row"><span class="stat-label">Velocidad</span><div class="stat-bar-wrapper"><div class="stat-bar"><div class="stat-bar-fill" id="bar-spd" style="background:#FFD600"></div></div><span class="stat-value" id="val-spd">0</span></div></div>
  </div>
</div>

<!-- ── ANIME ── -->
<div id="anime-panel" class="overlay-panel">
  <div class="anime-header" id="anime-header">
    <div class="anime-rarity-dot" id="anime-rarity-dot"></div>
    <div>
      <div class="anime-name" id="anime-name">???</div>
      <div class="anime-series" id="anime-series"></div>
    </div>
  </div>
  <div class="anime-gif-wrapper"><img id="anime-gif" src="" alt="anime"></div>
  <div class="anime-footer">
    <span class="anime-rarity-badge" id="anime-rarity-badge"></span>
    <span class="anime-triggered" id="anime-triggered"></span>
  </div>
</div>

<!-- ── MEDIA ── -->
<div id="media-panel" class="overlay-panel">
  <div class="media-header" id="media-header">
    <div>
      <div class="media-title" id="media-title"></div>
      <div class="media-triggered" id="media-triggered"></div>
    </div>
  </div>
  <div class="media-img-wrapper"><img id="media-gif" src="" alt="media"></div>
</div>

<!-- ══════════════════════════════════════════════════
     BATTLE SCENE — layout clasico estilo Pokemon Gen4/5
     ══════════════════════════════════════════════════ -->
<div id="battle-scene">

  <!-- Fondos -->
  <div id="bs-sky"></div>
  <div id="bs-ground-opp"></div>
  <div id="bs-ground-pl"></div>

  <!-- Oponente — sprite frontal arriba-derecha -->
  <div id="opp-sprite-zone">
    <img id="opp-sprite" src="" alt="oponent">
  </div>

  <!-- HUD oponente — arriba-izquierda -->
  <div id="opp-hud">
    <div class="b-hud-box" id="opp-hud-box">
      <div class="b-name-row">
        <span class="b-poke-name" id="opp-poke-name">???</span>
        <span class="b-level">Lv.50</span>
      </div>
      <div class="b-user" id="opp-user">@player2</div>
      <div class="b-hp-row">
        <span class="b-hp-lbl">HP</span>
        <div class="b-hp-track"><div class="b-hp-fill" id="opp-hp-fill"></div></div>
      </div>
      <div class="b-hp-nums" id="opp-hp-nums">0 / 0</div>
      <div class="b-turn-arrow" id="opp-arrow">&#9658; Es tu turno! usa !atacar</div>
    </div>
  </div>

  <!-- Jugador — sprite trasero abajo-izquierda -->
  <div id="pl-sprite-zone">
    <img id="pl-sprite" src="" alt="player">
  </div>

  <!-- HUD jugador — abajo-derecha -->
  <div id="pl-hud">
    <div class="b-hud-box" id="pl-hud-box">
      <div class="b-name-row">
        <span class="b-poke-name" id="pl-poke-name">???</span>
        <span class="b-level">Lv.50</span>
      </div>
      <div class="b-user" id="pl-user">@player1</div>
      <div class="b-hp-row">
        <span class="b-hp-lbl">HP</span>
        <div class="b-hp-track"><div class="b-hp-fill" id="pl-hp-fill"></div></div>
      </div>
      <div class="b-hp-nums" id="pl-hp-nums">0 / 0</div>
      <div class="b-turn-arrow" id="pl-arrow">&#9658; Es tu turno! usa !atacar</div>
    </div>
  </div>

  <!-- GIF de inicio -->
  <img id="bs-start-gif" src="" alt="start">

  <!-- GIF de ataque -->
  <img id="bs-attack-gif" src="" alt="attack">

  <!-- Cuadro de mensajes -->
  <div id="bs-msgbox">
    <p id="bs-msg"></p>
    <p id="bs-turn-ind"></p>
  </div>

  <!-- Pantalla VS (se muestra al inicio del combate) -->
  <div id="bs-vs-screen">
    <div class="vs-side" id="vs-left">
      <img id="vs-pl-sprite" src="" alt="">
      <div class="vs-poke" id="vs-pl-poke"></div>
      <div class="vs-user" id="vs-pl-user"></div>
    </div>
    <div id="vs-divider">VS</div>
    <div class="vs-side" id="vs-right">
      <img id="vs-opp-sprite" src="" alt="">
      <div class="vs-poke" id="vs-opp-poke"></div>
      <div class="vs-user" id="vs-opp-user"></div>
    </div>
  </div>

  <!-- Victoria -->
  <div id="bs-victory">
    <div id="bs-victory-title">VICTORIA!</div>
    <div id="bs-victory-sub"></div>
    <div id="bs-victory-pts">+50 Puntos</div>
  </div>

</div>

<!-- ── VIDEO (!paquito) ── -->
<div id="video-panel">
  <div class="video-header">
    <span class="video-title" id="video-title-text">🐾 Paquito</span>
    <span class="video-triggered" id="video-triggered"></span>
  </div>
  <video id="paquito-video" playsinline>
    <source id="paquito-source" src="" type="video/mp4">
  </video>
</div>

<!-- Botón de activación de audio (solo visible hasta que el usuario hace clic) -->
<div id="audio-unlock" style="
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.75); cursor: pointer;
" onclick="unlockAudio()">
  <div style="
    background: #e53935; border-radius: 16px; padding: 20px 36px;
    font-family: 'Press Start 2P', monospace; font-size: 12px;
    color: #fff; text-align: center; letter-spacing: 1px;
    box-shadow: 0 0 30px rgba(229,57,53,0.6);
  ">
    🔊 Clic para activar audio del overlay
    <div style="font-size:8px;color:#ffb3b3;margin-top:10px;">
      Solo necesitas hacer esto una vez
    </div>
  </div>
</div>

<audio id="pokemon-cry" preload="none"></audio>

<script>
  // ── CONSTANTES ──────────────────────────────────────────────────────────
  const TYPE_COLORS = {
    fire:'#FF6B35',water:'#4FC3F7',grass:'#66BB6A',electric:'#FFD600',
    psychic:'#F06292',ice:'#80DEEA',dragon:'#7E57C2',dark:'#5D4037',
    fairy:'#F48FB1',normal:'#9E9E9E',fighting:'#EF5350',flying:'#90CAF9',
    poison:'#AB47BC',ground:'#FFCA28',rock:'#BCAAA4',bug:'#AED581',
    ghost:'#7986CB',steel:'#78909C'
  };
  const RARITY_COLORS = { comun:'#9E9E9E', raro:'#4FC3F7', epico:'#AB47BC', legendario:'#FFD600' };

  // ── COLA DE EVENTOS (pokedex, anime, media) ────────────────────────────
  const eventQueue   = [];
  let isShowingEvent = false;

  function enqueue(data) {
    eventQueue.push(data);
    if (!isShowingEvent) processQueue();
  }

  function processQueue() {
    if (eventQueue.length === 0) { isShowingEvent = false; return; }
    isShowingEvent = true;
    const data = eventQueue.shift();
    if (data.type === 'pokedex') showPokemon(data);
    if (data.type === 'anime')   showAnime(data);
    if (data.type === 'media')   showMedia(data);
    if (data.type === 'video')   showVideo(data);
  }

  function onEventFinished() { setTimeout(processQueue, 500); }

  function showPanel(panel, duration, onHide) {
    panel.style.display   = 'block';
    panel.style.animation = 'slideIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275)';
    setTimeout(() => {
      panel.style.animation = 'slideOut 0.4s ease forwards';
      setTimeout(() => { panel.style.display = 'none'; onHide(); }, 400);
    }, duration);
  }

  // ── POKÉDEX ─────────────────────────────────────────────────────────────
  const pokedexPanel = document.getElementById('pokedex-panel');
  const sprite       = document.getElementById('pokemon-sprite');
  const cry          = document.getElementById('pokemon-cry');

  function loadSprite(data) {
    const fb = [data.animatedUrl, data.spriteUrl,
      `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${data.id}.png`
    ].filter(u => u && u.length > 0);
    let idx = 0;
    sprite.onerror = () => { idx++; if (idx < fb.length) sprite.src = fb[idx]; else sprite.style.display='none'; };
    sprite.style.display = 'block';
    sprite.src = fb[0];
  }

  function showPokemon(data) {
    document.getElementById('pokemon-number').textContent  = '#' + String(data.id).padStart(3,'0');
    document.getElementById('pokemon-name').textContent    = data.name;
    document.getElementById('pokemon-triggered').textContent = 'lanzado por @' + data.triggeredBy;
    loadSprite(data);
    const typesEl = document.getElementById('pokemon-types');
    typesEl.innerHTML = '';
    data.types.split('/').forEach(type => {
      const b = document.createElement('span'); b.className = 'type-badge';
      b.textContent = type; b.style.background = TYPE_COLORS[type.toLowerCase()] || '#999';
      typesEl.appendChild(b);
    });
    [{bar:'bar-hp',val:'val-hp',v:data.stats.hp},{bar:'bar-atk',val:'val-atk',v:data.stats.attack},
      {bar:'bar-def',val:'val-def',v:data.stats.defense},{bar:'bar-spd',val:'val-spd',v:data.stats.speed}]
      .forEach(s => {
        document.getElementById(s.val).textContent = s.v;
        const fill = document.getElementById(s.bar); fill.style.width='0%';
        setTimeout(() => { fill.style.width = Math.min(100,(s.v/255)*100)+'%'; }, 400);
      });
    try { cry.src=data.cryUrl; cry.volume=0.1; cry.play().catch(()=>{}); } catch(e) {}
    showPanel(pokedexPanel, 12000, onEventFinished);
  }

  // ── ANIME ───────────────────────────────────────────────────────────────
  const animePanel = document.getElementById('anime-panel');

  function showAnime(data) {
    document.getElementById('anime-name').textContent     = data.name;
    document.getElementById('anime-series').textContent   = data.series;
    document.getElementById('anime-triggered').textContent = 'invocado por @' + data.triggeredBy;
    const r = data.rarity || 'comun', rc = RARITY_COLORS[r] || '#9E9E9E';
    document.getElementById('anime-rarity-dot').style.background  = rc;
    document.getElementById('anime-rarity-dot').style.boxShadow   = `0 0 8px ${rc}`;
    document.getElementById('anime-rarity-badge').textContent      = r;
    document.getElementById('anime-rarity-badge').style.background = rc+'33';
    document.getElementById('anime-rarity-badge').style.color      = rc;
    document.getElementById('anime-rarity-badge').style.border     = `1px solid ${rc}`;
    document.getElementById('anime-header').style.borderBottom     = `2px solid ${rc}`;
    animePanel.style.border    = `3px solid ${rc}`;
    animePanel.style.boxShadow = `0 0 30px ${rc}50`;
    document.getElementById('anime-gif').src = data.gifUrl;
    showPanel(animePanel, 10000, onEventFinished);
  }

  // ── MEDIA ───────────────────────────────────────────────────────────────
  const mediaPanel = document.getElementById('media-panel');

  function showMedia(data) {
    document.getElementById('media-title').textContent     = data.title;
    document.getElementById('media-triggered').textContent = 'invocado por @' + data.triggeredBy;
    document.getElementById('media-gif').src               = data.mediaUrl;
    const c = data.accentColor || '#e53935';
    mediaPanel.style.border    = '3px solid ' + c;
    mediaPanel.style.boxShadow = `0 0 30px ${c}80`;
    document.getElementById('media-header').style.borderBottom = '2px solid ' + c;
    if (data.soundUrl) { try { const s=new Audio(data.soundUrl); s.volume=0.2; s.play().catch(()=>{}); } catch(e){} }
    showPanel(mediaPanel, (data.durationSeconds||8)*1000, onEventFinished);
  }

  // ══════════════════════════════════════════════════════════════════════
  // BATTLE — logica del combate
  // ══════════════════════════════════════════════════════════════════════

  const battleScene   = document.getElementById('battle-scene');
  const oppSpriteEl   = document.getElementById('opp-sprite');
  const plSpriteEl    = document.getElementById('pl-sprite');
  const bsStartGif    = document.getElementById('bs-start-gif');
  const bsAttackGif   = document.getElementById('bs-attack-gif');
  const bsVsScreen    = document.getElementById('bs-vs-screen');
  const bsVictory     = document.getElementById('bs-victory');
  let   battleState   = null;

  // Color de barra HP estilo Pokemon
  function hpColor(pct) {
    if (pct > 0.50) return '#18C818';
    if (pct > 0.20) return '#F8D030';
    return '#F02020';
  }

  function updateHpBar(fillId, numsId, hp, maxHp) {
    const pct  = Math.max(0, hp / maxHp);
    const fill = document.getElementById(fillId);
    const nums = document.getElementById(numsId);
    fill.style.width           = (pct * 100) + '%';
    fill.style.backgroundColor = hpColor(pct);
    nums.textContent            = hp + ' / ' + maxHp;
  }

  function setActiveTurn(turnName) {
    if (!battleState) return;
    const p1Active = turnName === battleState.player1.name;
    document.getElementById('opp-hud-box').classList.toggle('active-turn',  p1Active ? false : true);
    document.getElementById('pl-hud-box').classList.toggle('active-turn',   p1Active);
    document.getElementById('opp-arrow').style.display = p1Active ? 'none' : 'block';
    document.getElementById('pl-arrow').style.display  = p1Active ? 'block' : 'none';
  }

  function setMsg(text, turnName) {
    const msg  = document.getElementById('bs-msg');
    const turn = document.getElementById('bs-turn-ind');
    msg.style.animation = 'none'; void msg.offsetHeight;
    msg.style.animation = 'msgAppear 0.25s ease';
    msg.textContent  = text;
    turn.textContent = turnName ? '> Turno de @' + turnName + ' — usa !atacar' : '';
  }

  function showDmgNumber(isOpp, damage) {
    const el = document.createElement('div');
    el.className   = 'bs-dmg';
    el.textContent = '-' + damage;
    // Posicion fija segun el lado
    el.style.position = 'absolute';
    if (isOpp) {
      el.style.right = '220px';
      el.style.top   = '120px';
    } else {
      el.style.left = '260px';
      el.style.top  = '220px';
    }
    battleScene.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }

  // ── battle_start ────────────────────────────────────────────────────────

  function onBattleStart(data) {
    battleState = data;

    // Rellenar sprites y HUD
    document.getElementById('opp-poke-name').textContent = data.player2.pokemon;
    document.getElementById('opp-user').textContent      = '@' + data.player2.name;
    updateHpBar('opp-hp-fill', 'opp-hp-nums', data.player2.hp, data.player2.maxHp);
    oppSpriteEl.src     = data.player2.spriteUrl;
    oppSpriteEl.onerror = () => {};

    document.getElementById('pl-poke-name').textContent = data.player1.pokemon;
    document.getElementById('pl-user').textContent      = '@' + data.player1.name;
    updateHpBar('pl-hp-fill', 'pl-hp-nums', data.player1.hp, data.player1.maxHp);
    plSpriteEl.src     = data.player1.backSpriteUrl || data.player1.spriteUrl;
    plSpriteEl.onerror = () => { plSpriteEl.src = data.player1.spriteUrl; };

    // Ocultar victoria si quedaba del combate anterior
    bsVictory.style.display = 'none';

    // Mostrar escena
    battleScene.style.display   = 'block';
    battleScene.style.animation = 'sceneUp 0.55s cubic-bezier(0.175,0.885,0.32,1.275)';

    // Pantalla VS rapida
    document.getElementById('vs-pl-sprite').src  = data.player1.backSpriteUrl || data.player1.spriteUrl;
    document.getElementById('vs-opp-sprite').src = data.player2.spriteUrl;
    document.getElementById('vs-pl-poke').textContent  = data.player1.pokemon;
    document.getElementById('vs-pl-user').textContent  = '@' + data.player1.name;
    document.getElementById('vs-opp-poke').textContent = data.player2.pokemon;
    document.getElementById('vs-opp-user').textContent = '@' + data.player2.name;
    bsVsScreen.style.display   = 'flex';
    bsVsScreen.style.animation = 'vsIn 0.3s ease';

    // Tras 2.2s, ocultar VS y animar entrada de sprites
    setTimeout(() => {
      bsVsScreen.style.animation = 'vsOut 0.6s ease forwards';
      setTimeout(() => {
        bsVsScreen.style.display = 'none';
        // Sprites entran desde los laterales
        document.getElementById('pl-sprite-zone').style.animation  = 'spriteFromLeft  0.6s ease both';
        document.getElementById('opp-sprite-zone').style.animation = 'spriteFromRight 0.6s ease both';
      }, 600);
    }, 2200);

    // Turno inicial
    setTimeout(() => {
      setActiveTurn(data.currentTurn || data.player1.name);
      setMsg('Que hara ' + data.player1.pokemon + ' de @' + data.player1.name + '?',
             data.currentTurn || data.player1.name);
    }, 3000);

    // GIF de inicio
    if (data.startGifUrl && data.startGifUrl.length > 5) {
      bsStartGif.src     = data.startGifUrl;
      bsStartGif.style.display    = 'block';
      bsStartGif.style.animation  = 'gifFlash 2s ease forwards';
      setTimeout(() => { bsStartGif.style.display = 'none'; }, 2000);
    }
  }

  // ── battle_attack ────────────────────────────────────────────────────────

  function onBattleAttack(data) {
    if (!battleState) return;

    const p1Attacks = data.attacker === battleState.player1.name;
    const attackerZoneId = p1Attacks ? 'pl-sprite-zone' : 'opp-sprite-zone';
    const defenderZoneId = p1Attacks ? 'opp-sprite-zone' : 'pl-sprite-zone';
    const defenderSpriteEl = p1Attacks ? oppSpriteEl : plSpriteEl;

    // 1. Atacante se lanza hacia el oponente
    const attackZone = document.getElementById(attackerZoneId);
    attackZone.style.animation = p1Attacks ? 'lunge 0.38s ease' : 'lungeBack 0.38s ease';
    setTimeout(() => { attackZone.style.animation = ''; }, 380);

    // 2. GIF de ataque
    if (data.attackGifUrl && data.attackGifUrl.length > 5) {
      bsAttackGif.src            = data.attackGifUrl;
      bsAttackGif.style.display  = 'block';
      bsAttackGif.style.animation = 'gifFlash 1.2s ease forwards';
      setTimeout(() => { bsAttackGif.style.display = 'none'; }, 1200);
    }

    // 3. Golpe en el defensor (con delay)
    setTimeout(() => {
      const defZone = document.getElementById(defenderZoneId);
      defZone.style.animation           = 'hitShake 0.45s ease';
      defenderSpriteEl.style.animation  = 'hitFlash 0.5s ease';
      setTimeout(() => {
        defZone.style.animation          = '';
        defenderSpriteEl.style.animation = '';
      }, 500);
      showDmgNumber(!p1Attacks, data.damage);
    }, 280);

    // 4. Actualizar barras HP
    setTimeout(() => {
      updateHpBar('opp-hp-fill', 'opp-hp-nums', data.player2.hp, data.player2.maxHp);
      updateHpBar('pl-hp-fill',  'pl-hp-nums',  data.player1.hp, data.player1.maxHp);
    }, 320);

    // 5. Mensaje de ataque
    const atkPoke = p1Attacks ? battleState.player1.pokemon : battleState.player2.pokemon;
    const defPoke = p1Attacks ? battleState.player2.pokemon : battleState.player1.pokemon;
    setMsg(atkPoke + ' de @' + data.attacker + ' ataco a ' + defPoke + '! -' + data.damage + ' HP',
           null);

    // 6. Comprobacion de KO
    const p1Fainted  = data.player1.hp <= 0;
    const p2Fainted  = data.player2.hp <= 0;
    if (p1Fainted) setTimeout(() => faintSprite('pl'),  500);
    if (p2Fainted) setTimeout(() => faintSprite('opp'), 500);

    // 7. Turno siguiente (si no ha terminado)
    if (!p1Fainted && !p2Fainted) {
      setTimeout(() => {
        setActiveTurn(data.currentTurn);
        setMsg('Que hara ' + (data.currentTurn === battleState.player1.name
                 ? battleState.player1.pokemon : battleState.player2.pokemon)
               + '?', data.currentTurn);
      }, 900);
    }
  }

  function faintSprite(side) {
    const zone = document.getElementById(side + '-sprite-zone');
    zone.style.animation = 'faintDown 0.85s ease forwards';
    setTimeout(() => { zone.style.opacity = '0'; }, 850);
  }

  // ── battle_end ────────────────────────────────────────────────────────────

  function onBattleEnd(data) {
    // Saltar el turno
    setActiveTurn('');
    document.getElementById('opp-arrow').style.display = 'none';
    document.getElementById('pl-arrow').style.display  = 'none';

    // Animacion de victoria en el sprite ganador
    const p1Won    = data.winner === battleState.player1.name;
    const winZone  = document.getElementById(p1Won ? 'pl-sprite-zone' : 'opp-sprite-zone');
    setTimeout(() => {
      winZone.style.animation = 'victoryJump 0.7s ease 3';
    }, 600);

    setMsg(data.fled
      ? '@' + data.loser + ' huyo del combate!'
      : '!El combate termino! @' + data.winner + ' gana!', null);

    // Pantalla de victoria
    setTimeout(() => {
      document.getElementById('bs-victory-title').textContent = data.fled ? 'ABANDONO' : 'VICTORIA!';
      document.getElementById('bs-victory-sub').textContent   = '@' + data.winner + ' gana el combate';
      document.getElementById('bs-victory-pts').textContent   = '+50 puntos conseguidos';
      bsVictory.style.display = 'flex';
    }, 1800);

    // Cerrar escena tras 7 segundos
    setTimeout(() => {
      battleScene.style.animation = 'sceneDown 0.6s ease forwards';
      setTimeout(() => {
        battleScene.style.display   = 'none';
        bsVictory.style.display     = 'none';
        // Restaurar visibilidad de sprites para el proximo combate
        document.getElementById('pl-sprite-zone').style.opacity  = '1';
        document.getElementById('opp-sprite-zone').style.opacity = '1';
        battleState = null;
      }, 650);
    }, 7000);
  }

  // ── AUDIO UNLOCK ──────────────────────────────────────────────────────────
  // Chrome bloquea autoplay con sonido hasta que el usuario interactúa.
  // El botón de unlock hace esa interacción una sola vez.

  let audioUnlocked = false;

  function unlockAudio() {
    audioUnlocked = true;
    document.getElementById('audio-unlock').style.display = 'none';
    console.log('Audio desbloqueado ✅');
  }

  // ── VIDEO (!paquito) ─────────────────────────────────────────────────────

  const videoPanel   = document.getElementById('video-panel');
  const paquitoVideo = document.getElementById('paquito-video');
  const paquitoSrc   = document.getElementById('paquito-source');
  let videoTimeout   = null;

  function showVideo(data) {
    if (videoTimeout) clearTimeout(videoTimeout);

    // Título dinámico (Paquito, Meme, etc.)
    document.getElementById('video-title-text').textContent = data.title || '🐾 Paquito';
    document.getElementById('video-triggered').textContent = 'invocado por @' + data.triggeredBy;

    // Cargar fuente
    paquitoSrc.src = data.videoUrl;
    paquitoVideo.load();
    paquitoVideo.volume = data.volume || 0.8;

    // Mostrar panel
    videoPanel.style.display   = 'block';
    videoPanel.style.animation = 'videoIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275)';

    // Esperar a que el vídeo esté listo para reproducir
    const tryPlay = () => {
      // Si el evento viene marcado como muted (ej: recompensa "meme" sin sonido)
      // fuerza muted=true y NO necesita audio unlock
      if (data.muted === true) {
        paquitoVideo.muted = true;
      } else {
        paquitoVideo.muted = !audioUnlocked;
      }

      paquitoVideo.play().then(() => {
        if (audioUnlocked && data.muted !== true) paquitoVideo.muted = false;
      }).catch(e => {
        console.warn('play() bloqueado, reintentando en mute:', e);
        paquitoVideo.muted = true;
        paquitoVideo.play().catch(e2 => console.error('No se pudo reproducir:', e2));
      });
    };

    if (paquitoVideo.readyState >= 3) tryPlay();
    else paquitoVideo.addEventListener('canplay', tryPlay, { once: true });

    // Failsafe: cierre máximo 30s aunque el vídeo no emita 'ended'
    const maxDuration = (data.durationSeconds || 30) * 1000;
    videoTimeout = setTimeout(hideVideo, maxDuration);
  }

  function hideVideo() {
    if (videoTimeout) { clearTimeout(videoTimeout); videoTimeout = null; }
    videoPanel.style.animation = 'videoOut 0.4s ease forwards';
    paquitoVideo.pause();
    setTimeout(() => {
      videoPanel.style.display = 'none';
      paquitoVideo.currentTime = 0;
      onEventFinished();  // ← libera la cola
    }, 400);
  }

  paquitoVideo.addEventListener('ended', () => {
    hideVideo();
  });

  // ── WEBSOCKET ─────────────────────────────────────────────────────────────

  function connectWebSocket() {
    const ws = new WebSocket('ws://localhost:8765');
    ws.onopen    = () => console.log('Overlay conectado al bot');
    ws.onclose   = () => { console.log('Reconectando en 3s...'); setTimeout(connectWebSocket, 3000); };
    ws.onerror   = (e) => console.error('WebSocket error', e);
    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.type === 'battle_start')  { onBattleStart(data);  return; }
        if (data.type === 'battle_attack') { onBattleAttack(data); return; }
        if (data.type === 'battle_end')    { onBattleEnd(data);    return; }
        // video, pokedex, anime, media → todos van por la cola
        enqueue(data);
      } catch(err) {
        console.error('Error parseando mensaje', err);
      }
    };
  }

  connectWebSocket();
</script>
</body>
</html>
